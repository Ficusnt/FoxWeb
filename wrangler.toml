name = "fox-web"
compatibility_date = "2026-11-26"
main = "src/index.ts"
workers_dev = true

# KV namespaces — create these first, then uncomment and fill in the real IDs:
#   pnpm dlx wrangler kv namespace create TABLE_CONFIG
#   pnpm dlx wrangler kv namespace create TABLE_CSVS
#   pnpm dlx wrangler kv namespace create FOX_SESSIONS
#
[[kv_namespaces]]
binding = "FOX_SESSIONS"
id = "aad22b247c7246c8b0e3049a476040d1"

[[kv_namespaces]]
binding = "TABLE_CONFIG"
id = "a60c56bb22c244f2b2469619d8166260"

[[kv_namespaces]]
binding = "TABLE_CSVS"
id = "aeb673b796ce4389a0675a3df73c297c"

# D1 database — create this first, then uncomment and fill in the real ID:
#   pnpm dlx wrangler d1 create fox-db
#   pnpm dlx wrangler d1 execute fox-db --file=./src/schema.sql
#
[[d1_databases]]
binding = "FOX_DB"
database_name = "fox-db"
database_id = "da2450ff-361d-4ca3-9d4f-750106df1f62"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[vars]
ENVIRONMENT = "development"

# API_AUTH_TOKEN — set as a Cloudflare secret (not in code):
#   pnpm dlx wrangler secret put API_AUTH_TOKEN
# Then set VITE_API_AUTH_TOKEN in Cloudflare Pages env vars to the same value.